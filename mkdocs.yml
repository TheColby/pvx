site_name: pvx
site_description: Phase-vocoder DSP toolkit with audio augmentation for ML
site_url: https://thecolby.github.io/pvx/
repo_url: https://github.com/TheColby/pvx
repo_name: TheColby/pvx
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Installation & Quick Start: GETTING_STARTED.md
      - Examples: EXAMPLES.md
      - Pipeline Cookbook: PIPELINE_COOKBOOK.md
  - CLI Reference:
      - CLI Flags Reference: CLI_FLAGS_REFERENCE.md
      - API Overview: API_OVERVIEW.md
      - File Types: FILE_TYPES.md
  - Augmentation:
      - ML Integration Guide: ML_INTEGRATION.md
      - Augmentation Cookbook: AUGMENTATION_COOKBOOK.md
      - AI Augmentation: AI_AUGMENTATION.md
  - Architecture:
      - Architecture: ARCHITECTURE.md
      - Mathematical Foundations: MATHEMATICAL_FOUNDATIONS.md
      - Algorithm Limitations: ALGORITHM_LIMITATIONS.md
      - Quality Guide: QUALITY_GUIDE.md
      - Window Reference: WINDOW_REFERENCE.md
  - Advanced:
      - Feature Sidechain: FEATURE_SIDECHAIN_EXAMPLES.md
      - Follow Migration: FOLLOW_MIGRATION.md
      - Diagrams: DIAGRAMS.md
      - Benchmarks: BENCHMARKS.md
      - Rubberband Comparison: RUBBERBAND_COMPARISON.md
  - Development:
      - Dev Notes: DEV_NOTES.md
      - How to Review: HOW_TO_REVIEW.md
      - Docs Contract: DOCS_CONTRACT.md
      - Changelog: ../CHANGELOG.md
