[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvx"
version = "0.1.0a1"
description = "Phase-vocoder DSP toolkit with pvx command suite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Colby Leider", email = "colby@thecolby.com" },
]
keywords = [
    "audio",
    "dsp",
    "phase-vocoder",
    "time-stretch",
    "pitch-shift",
    "data-augmentation",
    "machine-learning",
    "pytorch",
    "speech",
    "music",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12.1",
    "scipy>=1.10",
    "librosa>=0.10.2",
    "pyloudnorm>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/TheColby/pvx"
Repository = "https://github.com/TheColby/pvx"
Issues = "https://github.com/TheColby/pvx/issues"
Documentation = "https://github.com/TheColby/pvx/tree/main/docs"
Changelog = "https://github.com/TheColby/pvx/blob/main/CHANGELOG.md"
Release-Guide = "https://github.com/TheColby/pvx/blob/main/docs/ALPHA_RELEASE.md"

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "pymdown-extensions>=10.0",
    "mkdocstrings[python]>=0.24",
]
# ML/DL framework integrations (install only what you need)
torch = [
    "torch>=2.0",
    "torchaudio>=2.0",
]
huggingface = [
    "datasets>=2.14",
    "transformers>=4.35",
]
tensorflow = [
    "tensorflow>=2.13",
]
# Install all ML integrations at once
ml = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "datasets>=2.14",
    "transformers>=4.35",
]

# CLI entry points — stability tiers:
#   stable:       Public API; breaking changes require a major version bump.
#   beta:         Functional but interface may change in minor versions.
#   experimental: May change or be removed without notice; not for scripting.
[project.scripts]
# --- stable ---
pvx = "pvx.cli.pvx:main"               # unified entry point / orchestrator
pvxvoc = "pvx.cli.pvxvoc:main"          # core phase vocoder (time/pitch)
pvxfreeze = "pvx.cli.pvxfreeze:main"    # spectral freeze
pvxwarp = "pvx.cli.pvxwarp:main"        # envelope-driven warp
pvxformant = "pvx.cli.pvxformant:main"  # formant shifting
pvxfilter = "pvx.cli.pvxfilter:main"    # spectral filter
pvxretune = "pvx.cli.pvxretune:main"    # pitch retune
pvxanalysis = "pvx.cli.pvxanalysis:main" # audio analysis / metrics

# --- beta ---
pvxharmonize = "pvx.cli.pvxharmonize:main"
pvxconform = "pvx.cli.pvxconform:main"
pvxmorph = "pvx.cli.pvxmorph:main"
pvxtransient = "pvx.cli.pvxtransient:main"
pvxunison = "pvx.cli.pvxunison:main"
pvxdenoise = "pvx.cli.pvxdenoise:main"
pvxdeverb = "pvx.cli.pvxdeverb:main"
pvxlayer = "pvx.cli.pvxlayer:main"
pvxresponse = "pvx.cli.pvxresponse:main"
pvxenvelope = "pvx.cli.pvxenvelope:main"
pvxreshape = "pvx.cli.pvxreshape:main"
pvxtvfilter = "pvx.cli.pvxtvfilter:main"
pvxnoisefilter = "pvx.cli.pvxnoisefilter:main"
pvxbandamp = "pvx.cli.pvxbandamp:main"
pvxspeccompander = "pvx.cli.pvxspeccompander:main"
pvxring = "pvx.cli.pvxring:main"
pvxringfilter = "pvx.cli.pvxringfilter:main"
pvxringtvfilter = "pvx.cli.pvxringtvfilter:main"
pvxharmmap = "pvx.cli.pvxharmmap:main"

# --- experimental ---
hps-pitch-track = "pvx.cli.hps_pitch_track:main"
pvxchordmapper = "pvx.cli.pvxchordmapper:main"
pvxinharmonator = "pvx.cli.pvxinharmonator:main"
pvxtrajectoryreverb = "pvx.cli.pvxtrajectoryreverb:main"
# ML/DL augmentation tools (require optional extras: pip install pvx[torch])
pvxnoise = "pvx.cli.pvxnoise:main"
pvxrir = "pvx.cli.pvxrir:main"
pvxcodec = "pvx.cli.pvxcodec:main"
pvxspecaugment = "pvx.cli.pvxspecaugment:main"
pvxgain = "pvx.cli.pvxgain:main"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ISC",    # flake8-implicit-str-concat
]
ignore = [
    "E501",    # line too long — handled by formatter
    "B905",    # zip without strict — too noisy
    "SIM108",  # ternary operator — readability preference
    "RET504",  # unnecessary assign before return — readability
    "UP007",   # use X | Y — keep Optional for 3.10 compat
    "ISC001",  # conflicts with ruff-format
    "PT011",   # pytest.raises too broad — sometimes intentional
    # Legacy patterns we're not bulk-rewriting:
    "PT009",   # unittest-style assertions (test suite uses unittest.TestCase)
    "PT027",   # unittest-style assertRaises
    "N806",    # non-lowercase variables (DSP code uses N, T, B, C, etc.)
    "N803",    # non-lowercase argument names (e.g. STFT params)
    "N805",    # first arg name (legitimate in some classmethod patterns)
    "RUF046",  # unnecessary int() cast — readability for explicit DSP code
    "TC001",   # typing-only first-party import — adds churn
    "TC002",   # typing-only third-party import — adds churn
    "TC003",   # typing-only stdlib import — adds churn
    "E402",    # module import not at top — common in scripts/CLIs
]

[tool.ruff.lint.isort]
known-first-party = ["pvx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
