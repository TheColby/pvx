[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvx"
version = "0.1.0a1"
description = "Phase-vocoder DSP toolkit with pvx command suite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Colby Leider", email = "colby@thecolby.com" },
]
keywords = [
    "audio",
    "dsp",
    "phase-vocoder",
    "time-stretch",
    "pitch-shift",
    "data-augmentation",
    "machine-learning",
    "pytorch",
    "speech",
    "music",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12.1",
    "scipy>=1.10",
    "librosa>=0.10.2",
    "pyloudnorm>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/TheColby/pvx"
Repository = "https://github.com/TheColby/pvx"
Issues = "https://github.com/TheColby/pvx/issues"
Documentation = "https://github.com/TheColby/pvx/tree/main/docs"

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6.0",
]
# ML/DL framework integrations (install only what you need)
torch = [
    "torch>=2.0",
    "torchaudio>=2.0",
]
huggingface = [
    "datasets>=2.14",
    "transformers>=4.35",
]
tensorflow = [
    "tensorflow>=2.13",
]
# Install all ML integrations at once
ml = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "datasets>=2.14",
    "transformers>=4.35",
]

[project.scripts]
pvx = "pvx.cli.pvx:main"
pvxvoc = "pvx.core.voc:main"
pvxfreeze = "pvx.cli.pvxfreeze:main"
pvxharmonize = "pvx.cli.pvxharmonize:main"
pvxconform = "pvx.cli.pvxconform:main"
pvxmorph = "pvx.cli.pvxmorph:main"
pvxwarp = "pvx.cli.pvxwarp:main"
pvxformant = "pvx.cli.pvxformant:main"
pvxtransient = "pvx.cli.pvxtransient:main"
pvxunison = "pvx.cli.pvxunison:main"
pvxdenoise = "pvx.cli.pvxdenoise:main"
pvxdeverb = "pvx.cli.pvxdeverb:main"
pvxretune = "pvx.cli.pvxretune:main"
pvxlayer = "pvx.cli.pvxlayer:main"
hps-pitch-track = "pvx.cli.hps_pitch_track:main"
pvxanalysis = "pvx.cli.pvxanalysis:main"
pvxresponse = "pvx.cli.pvxresponse:main"
pvxenvelope = "pvx.cli.pvxenvelope:main"
pvxreshape = "pvx.cli.pvxreshape:main"
pvxfilter = "pvx.cli.pvxfilter:main"
pvxtvfilter = "pvx.cli.pvxtvfilter:main"
pvxnoisefilter = "pvx.cli.pvxnoisefilter:main"
pvxbandamp = "pvx.cli.pvxbandamp:main"
pvxspeccompander = "pvx.cli.pvxspeccompander:main"
pvxring = "pvx.cli.pvxring:main"
pvxringfilter = "pvx.cli.pvxringfilter:main"
pvxringtvfilter = "pvx.cli.pvxringtvfilter:main"
pvxharmmap = "pvx.cli.pvxharmmap:main"
pvxchordmapper = "pvx.cli.pvxchordmapper:main"
pvxinharmonator = "pvx.cli.pvxinharmonator:main"
pvxtrajectoryreverb = "pvx.cli.pvxtrajectoryreverb:main"
# ML/DL augmentation tools
pvxnoise = "pvx.cli.pvxnoise:main"
pvxrir = "pvx.cli.pvxrir:main"
pvxcodec = "pvx.cli.pvxcodec:main"
pvxspecaugment = "pvx.cli.pvxspecaugment:main"
pvxgain = "pvx.cli.pvxgain:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
