name: deploy-docs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Build legacy documentation
        run: |
          python scripts/scripts_generate_python_docs.py
          python scripts/scripts_generate_theory_docs.py
          python scripts/scripts_generate_docs_extras.py
          python scripts/scripts_generate_html_docs.py

      - name: Build mkdocs site
        run: |
          pip install "pvx[docs]"
          mkdocs build --strict --site-dir site
          # Merge: mkdocs site is the primary, legacy docs go under /legacy/
          cp -r docs/html site/legacy/ 2>/dev/null || true
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
