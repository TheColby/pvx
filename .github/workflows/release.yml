name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install build coverage mypy pytest ruff

      - name: Run alpha contract gate
        run: |
          python scripts/scripts_alpha_check.py

      - name: Refresh tagged Homebrew formula
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/refresh_homebrew_formula.sh "${GITHUB_REF_NAME}"

      - name: Validate Homebrew formula
        run: |
          ruby -c Formula/pvx.rb

      - name: Sync formula into tap-shaped checkout
        run: |
          TAP_ROOT="${RUNNER_TEMP}/homebrew-pvx"
          mkdir -p "${TAP_ROOT}"
          python scripts/scripts_sync_homebrew_tap_formula.py "${TAP_ROOT}"

      - name: Build distributions
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: Formula/pvx.rb

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            Formula/pvx.rb
